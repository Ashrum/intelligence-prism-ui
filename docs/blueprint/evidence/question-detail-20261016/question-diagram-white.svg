<svg xmlns="http://www.w3.org/2000/svg" style="background:white;color:#16181D" viewBox="0 0 480 310" class="block h-auto w-full text-foreground" role="img" aria-labelledby="_R_0_-title _R_0_-description"><title id="_R_0_-title">直角坐标系中的矩形 ONMP</title><desc id="_R_0_-description">O为原点，A在x轴坐标6处，B在y轴坐标4处。M为线段AB上的示意点，N和P分别为其在x轴和y轴上的垂足。四点O、N、M、P构成矩形。</desc><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M34 260H435m-9 -5 9 5-9 5M65 282V25m-5 9 5-9 5 9"></path><path d="M65 60 395 260" stroke-width="2"></path><path d="M65 260H197V140H65Z" fill="currentColor" fill-opacity=".045"></path><path d="M187 260v-10h10M65 150h10v-10" stroke-width="1"></path></g><g fill="currentColor"><circle cx="197" cy="140" r="3"></circle><circle cx="395" cy="260" r="2.5"></circle><circle cx="65" cy="60" r="2.5"></circle></g><g fill="currentColor" font-size="17" font-family="system-ui,sans-serif"><text x="44" y="280">O</text><text x="385" y="286">A(6, 0)</text><text x="78" y="58">B(0, 4)</text><text x="205" y="136">M</text><text x="191" y="283">N</text><text x="42" y="145">P</text><text x="444" y="265" font-style="italic">x</text><text x="73" y="24" font-style="italic">y</text></g></svg>
